version: '3.8'

services:
  frontend:
    build: 
      context: .
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.fcsnigeria.org/api}
    container_name: fcs-reg-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - fcs-network

networks:
  fcs-network:
    external: true
    name: fcs-registration-backend_fcs-network
